<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Safety Shield in background with glow -->
  <path d="M256 90 L380 145 C380 255 295 335 256 365 C217 335 132 255 132 145 Z" 
        fill="rgba(16, 185, 129, 0.15)" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Shopping Trolley Basket -->
  <g id="trolley" filter="url(#glow)">
    <!-- Handle & Main Frame -->
    <path d="M140 180 L185 180 L225 315 L350 315" 
          fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Basket Body -->
    <path d="M185 205 L365 205 L345 285 L215 285 Z" 
          fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="12" stroke-linejoin="round" />

    <!-- Basket Grid Lines -->
    <line x1="230" y1="205" x2="245" y2="285" stroke="rgba(255,255,255,0.6)" stroke-width="6" />
    <line x1="275" y1="205" x2="285" y2="285" stroke="rgba(255,255,255,0.6)" stroke-width="6" />
    <line x1="320" y1="205" x2="320" y2="285" stroke="rgba(255,255,265,0.6)" stroke-width="6" />
    <line x1="200" y1="245" x2="355" y2="245" stroke="rgba(255,255,255,0.6)" stroke-width="6" />

    <!-- Wheels -->
    <circle cx="235" cy="355" r="22" fill="#10b981" stroke="#f8fafc" stroke-width="8" />
    <circle cx="335" cy="355" r="22" fill="#10b981" stroke="#f8fafc" stroke-width="8" />
  </g>

  <!-- Rupiah / Budget Safety Badge -->
  <g transform="translate(320, 110)">
    <circle cx="45" cy="45" r="42" fill="#f59e0b" stroke="#fef3c7" stroke-width="6" filter="url(#glow)" />
    <text x="45" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#78350f" text-anchor="middle">Rp</text>
  </g>

  <!-- Up/Down Price Comparison Micro-Badge -->
  <g transform="translate(130, 240)">
    <circle cx="20" cy="20" r="22" fill="#10b981" />
    <path d="M20 12 L13 22 L17 22 L17 28 L23 28 L23 22 L27 22 Z" fill="#ffffff" />
  </g>
</svg>
