<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background rounded squircle with pastel border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#cbd5e1" stroke-width="3" />

  <!-- Safety Shield in background -->
  <path d="M256 90 L380 145 C380 255 295 335 256 365 C217 335 132 255 132 145 Z" 
        fill="#dcfce7" stroke="#86efac" stroke-width="8" stroke-linejoin="round" />

  <!-- Shopping Trolley Basket -->
  <g id="trolley" filter="url(#softShadow)">
    <!-- Handle & Main Frame -->
    <path d="M140 180 L185 180 L225 315 L350 315" 
          fill="none" stroke="#1e293b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Basket Body -->
    <path d="M185 205 L365 205 L345 285 L215 285 Z" 
          fill="#e0f2fe" stroke="#0284c7" stroke-width="12" stroke-linejoin="round" />

    <!-- Basket Grid Lines -->
    <line x1="230" y1="205" x2="245" y2="285" stroke="#38bdf8" stroke-width="6" />
    <line x1="275" y1="205" x2="285" y2="285" stroke="#38bdf8" stroke-width="6" />
    <line x1="320" y1="205" x2="320" y2="285" stroke="#38bdf8" stroke-width="6" />
    <line x1="200" y1="245" x2="355" y2="245" stroke="#38bdf8" stroke-width="6" />

    <!-- Wheels -->
    <circle cx="235" cy="355" r="22" fill="#059669" stroke="#ffffff" stroke-width="7" />
    <circle cx="335" cy="355" r="22" fill="#059669" stroke="#ffffff" stroke-width="7" />
  </g>

  <!-- Rupiah / Budget Safety Badge (Pastel Yellow / Gold) -->
  <g transform="translate(320, 110)" filter="url(#softShadow)">
    <circle cx="45" cy="45" r="42" fill="#fef08a" stroke="#facc15" stroke-width="6" />
    <text x="45" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#854d0e" text-anchor="middle">Rp</text>
  </g>

  <!-- Up/Down Price Comparison Micro-Badge (Pastel Green) -->
  <g transform="translate(130, 240)">
    <circle cx="20" cy="20" r="22" fill="#10b981" />
    <path d="M20 12 L13 22 L17 22 L17 28 L23 28 L23 22 L27 22 Z" fill="#ffffff" />
  </g>
</svg>
